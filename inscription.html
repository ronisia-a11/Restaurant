        <option>Bilongue</option>
        <option>Akwa</option>
        <option>Village</option>
        <option>Yassa</option>
        <option>Lendi</option>
        <option>Ndokoti</option>
        <option>Ange Raphael</option>
        <option>elf</option>
        <option>Dakar</option>
        <option>Marche-village</option>
        <option>Bonanjo</option>
        <option>Bonamoussadi</option>
        <option>Bonaberi</option>
      </select>
      <label>Telephone :</label>
      <input type="text" name="telephone">
      <button type="submit">S'inscrire</button>
    </form>
